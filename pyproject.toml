[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md2html-offline"
version = "0.1.1"
description = "Read-only Markdown vault to a self-contained offline textbook"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PyYAML>=6,<7", "Jinja2>=3.1,<4", "bleach>=6,<7"]

[project.optional-dependencies]
gui = ["pywebview>=5,<7"]
pandoc = ["pypandoc_binary>=1.15,<2"]
dev = ["pytest>=8,<10", "playwright>=1.50,<2", "pypandoc_binary>=1.15,<2", "ruff>=0.17,<1", "pywebview>=5,<7"]

[project.scripts]
md2html = "md2html.cli:main"

[project.gui-scripts]
md2html-gui = "md2html.gui.__main__:main"

[tool.setuptools.package-data]
md2html = ["templates/*", "node/*.mjs", "vendor/*", "vendor/fonts/*", "gui/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: real offline file browser acceptance"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
